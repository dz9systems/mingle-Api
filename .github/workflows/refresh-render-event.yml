name: Refresh renderEvent

# Clears warm-instance SPA shell caches after a frontend hosting deploy.
# Triggered automatically from dz9systems/mingle hosting CI when
# MINGLE_API_DISPATCH_TOKEN is configured, or run manually.

on:
  repository_dispatch:
    types: [hosting-deployed]
  workflow_dispatch:

concurrency:
  group: refresh-render-event
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Prepare deploy env
        working-directory: functions
        run: cp .env.example .env

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy renderEvent only
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: firebase deploy --only functions:renderEvent --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive --force
